<main class="container">
<div class="page-title">
    <h1>Contact Us</h1>
    <p> 
        Get in touch with the Sierra Leone News Media
    </p>
</div>
 <div class="contact-container">
    <section class="contact-info">
        <h2> Contact Information</h2>
        <p>  <Strong>
            Location: Freetown Sierra Leone
        </Strong></p>
        <p> if you have a news tip, question or feedback, please contact our team.</p>
    </section>
 <section class="contact-form">
<h2> Send Us a Message</h2>
<form>
    <label for="name">
        name
    </label>
    <input 
    type="text"
    id="name"
    name="name"
    placeholder="Enter your name">
    <label for="email">
        email
    </label>
    <input
    type="email"
    id="email"
    name="email"
    placeholder="Enter your email">
    <label for="subject">
       subject  
    </label>
    <input
    type="text"
    id="subject"
    name="subject"
    placeholder="Enter subject">
    <label for="message">
        Message
    </label>
   <textarea
   id="message"
   name="message"
   placeholder="Write your message">
</textarea>
<button type="submit">
    Send Message
</button>
</form>
 </section>

</main>
